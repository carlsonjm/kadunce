<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Cards mark: one pearl card between its neighbours' edges, as
       Spread looks, shared with the Shuffle dock's Spread button. Plasma
       swaps in the theme's text colour, so it reads on a light ground as on
       a dark one; the shade toward the card's lower edge is the Tette Dot's
       pearl, lit from above. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #F8F8FF; }
    </style>
    <linearGradient id="pearl-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <mask id="slash" maskUnits="userSpaceOnUse" x="0" y="0"
          width="64" height="64">
      <rect width="64" height="64" fill="#ffffff"/>
      <path d="M12 10 52 54" fill="none" stroke="#000000"
            stroke-width="6" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="5" y="14.5" width="8" height="35" rx="4"
        class="ColorScheme-Text" fill="currentColor" fill-opacity="0.24"/>
  <rect x="51" y="14.5" width="8" height="35" rx="4"
        class="ColorScheme-Text" fill="currentColor" fill-opacity="0.24"/>
  <g mask="url(#slash)">
    <rect x="18.5" y="8" width="27" height="48" rx="8"
          class="ColorScheme-Text" fill="currentColor"/>
    <rect x="18.5" y="8" width="27" height="48" rx="8"
          fill="url(#pearl-shade)"/>
  </g>
</svg>
