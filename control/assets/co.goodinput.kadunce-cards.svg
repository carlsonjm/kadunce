<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Plasma swaps in the theme's text colour, so the cards read on a
         light ground as on a dark one. -->
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #F8F8FF; }
    </style>
    <mask id="rear-cards" maskUnits="userSpaceOnUse" x="0" y="0"
          width="64" height="64">
      <rect width="64" height="64" fill="#ffffff"/>
      <rect x="22" y="7" width="35" height="49" rx="7" fill="#000000"/>
    </mask>
    <mask id="front-card" maskUnits="userSpaceOnUse" x="0" y="0"
          width="64" height="64">
      <rect width="64" height="64" fill="#000000"/>
      <rect x="22" y="7" width="35" height="49" rx="7" fill="#ffffff"/>
      <path d="M31 20h17" fill="none" stroke="#000000"
            stroke-width="4" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#rear-cards)">
    <rect x="7" y="15" width="35" height="42" rx="7"
          transform="rotate(-10 42 57)"
          fill="none" class="ColorScheme-Text" stroke="currentColor" stroke-opacity="0.48"
          stroke-width="4"/>
    <rect x="14" y="10" width="36" height="45" rx="7"
          transform="rotate(-5 50 55)"
          fill="none" class="ColorScheme-Text" stroke="currentColor" stroke-opacity="0.72"
          stroke-width="4"/>
  </g>
  <rect x="22" y="7" width="35" height="49" rx="7"
        class="ColorScheme-Text" fill="currentColor" mask="url(#front-card)"/>
</svg>
