# Local full-featured rebuild, not a byte-for-byte CachyOS build reproduction.
# Retain this host's CachyOS hardening/O3/LTO; explicitly target its znver4 repo.
source /etc/makepkg.conf
CARCH=x86_64_v4
CFLAGS=${CFLAGS/-march=native/-march=znver4}
CXXFLAGS=${CXXFLAGS/-march=native/-march=znver4}
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge debug lto !autodeps)
MAKEFLAGS=-j4
NINJAFLAGS=-j4
export CMAKE_BUILD_PARALLEL_LEVEL=4
COMPRESSZST=(zstd -c -T4 -10 -)
