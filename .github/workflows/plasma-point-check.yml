name: Plasma point release check

# One-off check, on this branch only; never merged. Round 4: the exact
# CachyOS lookup shuffle's Packages gate makes, printed.
on:
  push:
    branches: [claude/project-thread-cfmx2i]
    paths: [".github/workflows/plasma-point-check.yml"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
    steps:
      - run: |
          pacman -Sy >/dev/null
          lists="$(mktemp -d)"
          printf '%s\n' '[options]' 'Architecture = x86_64 x86_64_v3' 'SigLevel = Never' > "${lists}/pacman.conf"
          for repo in cachyos-v3 cachyos-core-v3 cachyos-extra-v3; do
            printf '[%s]\nServer = https://mirror.cachyos.org/repo/x86_64_v3/$repo\n' "${repo}" >> "${lists}/pacman.conf"
          done
          mkdir "${lists}/db"
          pacman --config "${lists}/pacman.conf" --dbpath "${lists}/db" -Sy
          for package in kwin qt6-base kcoreaddons libplasma; do
            echo "${package}: arch=$(pacman -Si ${package} | awk '/^Version/ {print $3; exit}') cachyos=$(pacman --config "${lists}/pacman.conf" --dbpath "${lists}/db" -Si "${package}" 2>&1 | awk '/^Repository|^Version|error/ {printf "%s ", $0}')" | tee -a "$GITHUB_STEP_SUMMARY"
          done
