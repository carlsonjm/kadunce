name: Plasma point release check

# One-off check, on this branch only; never merged. Round 7: the Keyboard's
# sealed sessions on KWin 6.8.1, Arch and CachyOS, at the fix and at its base,
# in a privileged container as round 1 was.
on:
  push:
    branches: [claude/project-thread-cfmx2i]
    paths: [".github/workflows/plasma-point-check.yml"]

permissions:
  contents: read

jobs:
  sessions:
    name: Keyboard ${{ matrix.ref }} on ${{ matrix.source }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
      # Round 1 ran privileged, which gave KWin a render device; rounds 5 and
      # 6 did not, and the Keyboard drew nothing.
      options: --cap-add=SYS_NICE --privileged
    strategy:
      fail-fast: false
      matrix:
        source: [arch, cachyos]
        ref: [claude/project-thread-cfmx2i, shuffle-1.0]
    timeout-minutes: 45
    env:
      QT_FORCE_STDERR_LOGGING: "1"
    steps:
      - name: Put CachyOS's repositories above Arch's
        if: matrix.source == 'cachyos'
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver hkps://keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i 's/^#\?Architecture = .*/Architecture = x86_64 x86_64_v3/' /etc/pacman.conf
          sed -i '0,/^\[core\]/s//[cachyos-v3]\nServer = https:\/\/mirror.cachyos.org\/repo\/x86_64_v3\/$repo\n\n[cachyos-core-v3]\nServer = https:\/\/mirror.cachyos.org\/repo\/x86_64_v3\/$repo\n\n[cachyos-extra-v3]\nServer = https:\/\/mirror.cachyos.org\/repo\/x86_64_v3\/$repo\n\n[cachyos]\nServer = https:\/\/mirror.cachyos.org\/repo\/x86_64\/$repo\n\n[core]/' /etc/pacman.conf
      - name: Install the build stack
        run: |
          pacman -Syyuu --noconfirm --needed \
            base-devel clang cmake extra-cmake-modules git ninja pkgconf qt6-base \
            qt6-declarative qt6-virtualkeyboard qt6-wayland kcoreaddons ki18n kcmutils \
            kconfig kcrash libplasma layer-shell-qt libxkbcommon wayland \
            wayland-protocols plasma-wayland-protocols dbus kwin python-gobject mesa
          pacman -Q kwin qt6-base qt6-wayland mesa | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l /dev/dri 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        with:
          repository: carlsonjm/shuffle-keyboard
          ref: ${{ matrix.ref }}
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo > /dev/null
          cmake --build build > /dev/null
      - name: Run every sealed session
        env:
          SHUFFLE_KEYBOARD_BUILD: ${{ github.workspace }}/build
        run: |
          failed=()
          for session in tests/verify-*.sh; do
            echo "::group::${session}"
            status=0
            "${session}" || status=$?
            echo "::endgroup::"
            case "${status}" in
              0) echo "passed: ${session}" | tee -a "$GITHUB_STEP_SUMMARY" ;;
              77) echo "skipped: ${session}" | tee -a "$GITHUB_STEP_SUMMARY" ;;
              *) echo "FAILED: ${session}" | tee -a "$GITHUB_STEP_SUMMARY"; failed+=("${session}") ;;
            esac
          done
          ((${#failed[@]} == 0)) || { printf 'Failed: %s\n' "${failed[@]}"; exit 1; }
