name: Scenes

# Runs chosen private-compositor scenes on Arch's stock KWin, headless, so a
# change to placement or input can be proved before the device gate. The
# device gate still runs every scene before a handover.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      scenes:
        description: Scene names, as verify-integrated-carry.sh lists them
        required: false

permissions:
  contents: read

concurrency:
  group: scenes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenes:
    name: Scenes
    runs-on: ubuntu-latest
    # Arch Linux's official image as Arch publishes it to GitHub's own
    # registry, which Actions reaches without Docker Hub's or Amazon's
    # shared pull limits.
    container:
      image: ghcr.io/archlinux/archlinux:latest
    timeout-minutes: 45
    env:
      SCENES: ${{ github.event.inputs.scenes || 'monitor-zones-runtime monitor-overflow-runtime divider-tablet-runtime side-runtime spread-bento-top-runtime spread-bento-top-runtime@1.75 bento-motion-runtime sleeping-pane-runtime monitor-flee-runtime spread-display-runtime no-touch-runtime connected-runtime connected-stacks-runtime every-display-runtime connected-keys-runtime connected-bento-key-runtime connected-desk-keys-runtime stack-runtime late-maximize-active-runtime late-maximize-signin-runtime spread-signal-runtime context-line-runtime' }}
    steps:
      - name: Install build and session dependencies
        run: |
          # Held on Arch's last Plasma 6.7 day from the Arch Linux Archive.
          # KWin 6.8's virtual backend wants a GPU render device for OpenGL,
          # which a hosted runner lacks, so every scene would stop at start.
          # Move the date on once the scenes run headless on 6.8.
          echo 'Server = https://archive.archlinux.org/repos/2026/10/14/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed \
            base-devel cmake extra-cmake-modules git ripgrep python file perl dbus jq patch libkscreen python-dbus \
            qt6-base qt6-declarative qt6-tools qt6-wayland \
            kwin kdecoration kcoreaddons kconfig kservice kglobalaccel \
            kstatusnotifieritem libxcb vulkan-headers vulkan-icd-loader mesa xorg-xwayland

      - uses: actions/checkout@v5

      - name: Build the plugin, the tablet fixture and the probe
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/scenes"
          mkdir -p "$root"
          cmake -S native -B "$root/production" -DBUILD_TESTING=OFF >"$root/build.log" 2>&1 || { tail -50 "$root/build.log"; exit 1; }
          cmake --build "$root/production" -j4 >>"$root/build.log" 2>&1 || { tail -50 "$root/build.log"; exit 1; }
          mkdir "$root/fixture"
          cp -a native "$root/fixture/native"
          patch --batch --fuzz=0 -d "$root/fixture" -p1 <tests/virtual-tablet.patch
          cmake -S "$root/fixture/native" -B "$root/tablet" -DBUILD_TESTING=OFF >"$root/fixture.log" 2>&1
          cmake --build "$root/tablet" -j4 >>"$root/fixture.log" 2>&1 || { tail -50 "$root/fixture.log"; exit 1; }
          cmake -S tests/unload-probe -B "$root/probe" -DBUILD_TESTING=OFF >"$root/probe.log" 2>&1
          cmake --build "$root/probe" -j4 >>"$root/probe.log" 2>&1 || { tail -50 "$root/probe.log"; exit 1; }

      - name: Run the scenes
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/scenes"
          failed=0
          # Arch's kwin_wayland carries file capabilities a container may not
          # grant, so exec refuses it; a plain copy runs as an ordinary binary.
          cp "$(command -v kwin_wayland)" /tmp/kwin_wayland
          export KADUNCE_TEST_KWIN=/tmp/kwin_wayland
          for entry in $SCENES; do
            # scene@scale runs a scene that allows it at that display scale.
            scene=${entry%@*} scale=
            [[ $entry == *@* ]] && scale=${entry#*@}
            build=$(awk -v s="$scene" '$1 == s { print $2 }' tests/verify-integrated-carry.sh)
            [[ -n $build ]] || { echo "::error::$scene is not a gate scene"; failed=1; continue; }
            log="$root/$entry.log"
            if KADUNCE_TEST_SCALE="$scale" KADUNCE_PROBE_SESSION="$scene-session.sh" KADUNCE_RUNTIME_BUILD="$root/$build" \
                KADUNCE_PROBE_BUILD="$root/probe" bash -x tests/verify-unload-isolated.sh >"$log" 2>&1; then
              echo "ok    $entry"
            else
              echo "::error::$entry failed"
              failed=1
            fi
            echo "::group::$entry"
            tail -60 "$log"
            evidence=$(sed -n 's/^Isolated unload evidence: //p' "$log" | head -1)
            if [[ -n $evidence && -f $evidence/session.log ]]; then
              rg -a '(^| )(ok:|FAIL|PASS|state |facts |frames )|Kadunce .*(changed to|activated with|entered interactive|could not|holds the windows|declined|sends |handed|gave |placed|swapped|found nothing|leaves |takes |kept |behind it)' "$evidence/session.log" | tail -250 || true
              echo "--- last lines of the session log"
              tail -40 "$evidence/session.log" || true
            fi
            echo "::endgroup::"
          done
          exit "$failed"
